# Grug Fit Android app (Capacitor shell around the live site + native step counter).
# Builds a signed APK, runs the native unit tests, publishes a GitHub Release "android-v<version>" with a stable
# download URL (…/releases/latest/download/grug-fit.apk) when android/app/build.gradle's shellVersionName is new,
# then smoke-tests the APK on an emulator (launch, live site loads, offline start, step job scheduled).
# Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'android-shell/**', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - id: v
        run: echo "version=$(sed -nE "s/^def shellVersionName = '([^']+)'.*/\1/p" android/app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Unit tests + signed release APK
        working-directory: android
        env:
          GRUG_KEYSTORE: ${{ runner.temp }}/release.jks
          GRUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRUG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GRUG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp android/app/build/outputs/apk/release/app-release.apk grug-fit.apk
          sha256sum grug-fit.apk | tee grug-fit.apk.sha256
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: grug-fit-apk
          path: |
            grug-fit.apk
            grug-fit.apk.sha256
            android/app/build/test-results/
      - name: Publish release (new versions only)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "android-v$VER" >/dev/null 2>&1; then echo "android-v$VER already released – bump shellVersionName to publish"; exit 0; fi
          gh release create "android-v$VER" grug-fit.apk grug-fit.apk.sha256 --latest --title "Grug Fit Android $VER" --notes-file android-shell/RELEASE_NOTES.md --target "$GITHUB_SHA"
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grug-fit-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-shell/ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
