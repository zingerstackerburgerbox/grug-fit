name = "grug-coach-proxy"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true
preview_urls = false

# Workers KV for daily counters. Create it with:  npx wrangler kv namespace create COACH_KV
# then paste the printed id below (and a preview_id for `wrangler dev --remote`, optional).
[[kv_namespaces]]
binding = "COACH_KV"
id = "d64fc88337b842b6a12133b5286decd2"

[vars]
MODEL = "grok-4.7"
DEVICE_DAILY_CAP = "5"
# per network (salted hash of CF-Connecting-IP; friends on the same Wi-Fi share it)
IP_DAILY_CAP = "15"
GLOBAL_DAILY_CAP = "500"
MAX_INPUT_CHARS = "24000"
MAX_TOKENS = "1200"
KILL_SWITCH = "0"
# v1.10.0 Smart Estimate (Food tab): successful estimates per device per UTC day (raise when a paid tier exists);
# per network = EST_DAILY_CAP x EST_NETWORK_MULT. Separate from coach messages.
EST_DAILY_CAP = "3"
EST_NETWORK_MULT = "3"
EST_MAX_IMAGE_CHARS = "1500000"
EST_MAX_TOKENS = "1500"
# reasoning_effort sent to xAI for estimates ("none" = omit)
EST_REASONING = "low"
# v1.11.0 Grug's Review: successful reviews per device per Sydney week (Mon 00:00 Australia/Sydney); per network = x REVIEW_NETWORK_MULT
REVIEW_WEEKLY_CAP = "1"
REVIEW_NETWORK_MULT = "3"
REVIEW_MAX_TOKENS = "3000"
# Admin code: wrong/right attempts per hour per device and per network. Secrets ADMIN_SALT + ADMIN_CODE_HASH (= sha256(ADMIN_SALT + ":" + CODE upper-cased)); the code itself is never stored.
ADMIN_ATTEMPTS_PER_HOUR = "5"
# v1.12.0 leaderboard (opt-in): submits per device / per hashed network per hour; top N returned; entries expire after LB_TTL_DAYS without a submit
LB_SUBMITS_PER_HOUR = "20"
LB_NETWORK_SUBMITS_PER_HOUR = "60"
LB_TOP = "50"
LB_TTL_DAYS = "21"
ALLOWED_ORIGINS = "https://zingerstackerburgerbox.github.io,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"
# Secrets (never in this file): XAI_API_KEY (required), IP_SALT (required for private IP hashing), OWNER_TOKEN (optional), ADMIN_SALT + ADMIN_CODE_HASH (optional)

# Workers Rate Limiting binding: max 10 /chat requests per minute per network (counters are per Cloudflare location)
[[ratelimits]]
name = "COACH_RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
